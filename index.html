<!DOCTYPE html>
<html>
<head>
<title>Background Gradient</title>
<div class="tab-container">
    <button class="tab-button" onclick="openTab(event, 'Beranda')">Tab</button>
    
    <a href="https://discord.gg/pa3RWAGwJf" target="_blank" class="tab-button">
        Discord
    </a>
</div>
<style>
  body {
    /* Linear Gradient: Transisi mulus dari satu warna ke warna lain */
    /* Contoh: Dari Biru ke Ungu, mengarah ke sudut kanan bawah */
    background: linear-gradient(to bottom right, #4facfe, #00f2fe);
    
    /* Atau Radial Gradient: Warna menyebar dari tengah */
    /* background: radial-gradient(#FFD700, #FF6347); */

    /* Penting: Setel tinggi agar gradient terlihat */
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white; /* Agar teks terbaca pada background gelap */
    padding: 20px;
  }
</style>
</head>
<body>
  <h1>RSN: Roblox Service New</h1>
  <p>Hello, Developer RSN Here Nothing can say So Bye</p>
</body>

<script>
    function openTab(evt, tabcontainer) {
        var i, tabcontent, tablinks;

        // Menyembunyikan semua konten
        tabcontent = document.getElementsByClassName("tabcontent");
        for (i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = "none";
        }

        // Menghapus status 'active' dari semua tombol
        tablinks = document.getElementsByClassName("tab-button"); // Perhatikan class yang digunakan
        for (i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(" active", "");
        }

        // Menampilkan konten yang dipilih dan menandai tombolnya
        document.getElementById(tabcontainer).style.display = "block";
        evt.currentTarget.className += " active";
    }

    // Tampilkan tab Beranda secara default saat halaman dimuat
    document.addEventListener("DOMContentLoaded", function() {
        document.getElementsByClassName("tab-button")[0].click();
    });
</script>
</html>
